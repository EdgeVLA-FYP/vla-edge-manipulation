[project]
name = "vla-edge-manipulation"
version = "0.1.0"
description = "VLA model on an SO-101 arm, deployed to a Jetson Orin Nano — FYP"
requires-python = ">=3.12"
dependencies = [
    "numpy"
]

[project.optional-dependencies]
sim = ["mujoco", "pyyaml"]
dev = ["pytest", "ruff", "mypy", "pre-commit", "types-pyyaml"]

[project.scripts]
vla-sim-view = "vla_edge_manipulation.scripts.view_sim:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["src"]
ignore_missing_imports = true
