name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libglx-mesa0
      - run: pip install -e ".[dev,sim]"
      - run: cp configs/robot_sim.yaml.example configs/robot_sim.yaml
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest tests/ -v
        env:
          MUJOCO_GL: egl
